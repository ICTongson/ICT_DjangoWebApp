<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
</head>
<body>
    {% load static %}

    <h1>Student Dashboard</h1>

    <h2>
        Total Students:
        <span id="student-count">0</span>
    </h2>

    <p id="loading-message">Loading students...</p>
    <p id="error-message"></p>

    <table border="1" cellpadding="8" id="student-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Program</th>
                <th>Year Level</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="student-table-body">
        </tbody>
    </table>

    <br>
    <a href="{% url 'student_list' %}">⬅️ Back to Student List</a>

    <script src="{% static 'registration/js/student_dashboard.js' %}"></script>
</body>
</html>
